name: Deploy CourtIQ to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: courtiq/package-lock.json

      - name: Install dependencies
        working-directory: courtiq
        run: npm ci

      - name: Build
        working-directory: courtiq
        env:
          VITE_SUPABASE_URL: https://gqppfxcshihvtjrepiij.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxcHBmeGNzaGlodnRqcmVwaWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjUxNjMsImV4cCI6MjA4OTY0MTE2M30.JUP6a_AHzxOkMWkMSXdByPoYEd4qzlWTwTWLi_jBoM8
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: courtiq/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
