<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CourtIQ</title>
    <script>
      // SPA redirect for GitHub Pages
      // Stores the attempted URL and redirects to index.html so React Router handles routing
      sessionStorage.redirect = location.href;
      location.replace(
        location.pathname.split('/').slice(0, 2).join('/') + '/'
      );
    </script>
  </head>
  <body></body>
</html>
